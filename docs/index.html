<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anton Stolz</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        padding: 4rem 1.5rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        font-size: 17px;
        line-height: 1.65;
        color: #1a1a1a;
        background: #fff;
      }
      main { max-width: 34rem; margin: 0 auto; }
      h1 {
        font-size: 1.9rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 0 0 0.25rem;
      }
      h2 {
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #6b6b6b;
        margin: 2.75rem 0 0.75rem;
      }
      p { margin: 0 0 1rem; }
      .tagline { color: #6b6b6b; margin: 0; }
      ul { padding-left: 1.1rem; margin: 0; }
      li { margin-bottom: 0.35rem; }
      a {
        color: #0b5fff;
        text-decoration: none;
        border-bottom: 1px solid rgba(11, 95, 255, 0.25);
      }
      a:hover { border-bottom-color: #0b5fff; }
      .links {
        margin-top: 2.75rem;
        padding-top: 1.5rem;
        border-top: 1px solid #ebebeb;
      }
      .links a {
        display: inline-block;
        margin-right: 1.5rem;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #101010; color: #ededed; }
        h2, .tagline { color: #9a9a9a; }
        a { color: #6ea8ff; border-bottom-color: rgba(110, 168, 255, 0.3); }
        a:hover { border-bottom-color: #6ea8ff; }
        .links { border-top-color: #262626; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="hi-i-am-anton-wave">Hi, I am Anton 👋</h1>
<p class="tagline">Physics Student | Robotics Enthusiast</p>
<h2 id="about-me">About Me</h2>
<ul>
<li>Programming since 2018</li>
<li>Studying Physics at Ludwig-Maximilians-Universität München</li>
</ul>
<div class="links">
  <a href="https://github.com/anton-stolz">GitHub</a>
  <a href="https://www.linkedin.com/in/anton-stolz-b40600317">LinkedIn</a>
</div>

    </main>
  </body>
</html>
